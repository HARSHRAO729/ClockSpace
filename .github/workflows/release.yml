name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Secrets
        run: touch Secrets.xcconfig
        
      - name: Build and Package
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh
        env:
          CODE_SIGNING_ALLOWED: NO

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ClockSpace.dmg
          body: |
            ## ClockSpace ${{ github.ref_name }}

            The first stable release of ClockSpace — a native macOS screensaver marketplace.

            ### Highlights
            - **20 screensavers that actually run on modern macOS (Apple Silicon)** — every one is a universal (arm64 + x86_64), signed build. Clocks, generative art, and more.
            - **New cloud backend** — the catalog now streams from a fast, reliable CDN. The app stays lightweight and pulls each screensaver on demand.
            - **Native Swift throughout** — including a brand-new native Word Clock.
            - **Leaner, faster, cleaner** under the hood.

            **Note**: This build is unsigned. Right-click the app and choose "Open" the first time to launch it.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
