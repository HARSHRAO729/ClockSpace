name: Release

# Pushing a tag like v1.1.0 builds the DMG and opens a draft release.
# Review the notes on GitHub, then publish the draft.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unit tests
        run: |
          xcodebuild test \
            -project ClockSpace.xcodeproj \
            -scheme ClockSpace \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData

      - name: Build and package
        run: ./scripts/build_release.sh
        env:
          CODE_SIGNING_ALLOWED: NO
          # The tag must match the app's version (MARKETING_VERSION).
          EXPECTED_VERSION: ${{ github.ref_name }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: ClockSpace.dmg
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            1. Open `ClockSpace.dmg` and drag ClockSpace to Applications.
            2. ClockSpace isn't signed with an Apple Developer ID, so macOS blocks it the first time. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**.

            Requires macOS 14 or later, on Apple Silicon or Intel.
